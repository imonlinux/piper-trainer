[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-trainer"
version = "0.1.0"
description = "Packaged dataset-prep and training pipeline for piper1-gpl"
requires-python = ">=3.12"

[project.scripts]
piper-trainer = "piper_trainer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "httpx"]
# API server + Bones UI. Kept out of the default install: the CLI stays
# dependency-free and runs in images that never serve HTTP.
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# What the pipeline imports beyond the stdlib (soundfile and numpy arrive
# transitively and are not declared). The SUPPORTED path is the container:
# piper1-gpl (with both C extensions), ffmpeg, espeak-ng, and deep-filter
# are not pip-installable and are expected on PATH — run
# `piper-trainer doctor` to see what is missing. The default install is
# deliberately dependency-free.
runtime = ["auditok>=0.3", "faster-whisper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piper_trainer = ["api/catalog_snapshot.json", "ui/*"]
