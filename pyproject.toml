[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-trainer"
version = "0.1.0"
description = "Packaged dataset-prep and training pipeline for piper1-gpl"
requires-python = ">=3.12"

[project.scripts]
piper-trainer = "piper_trainer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
