[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-trainer"
version = "0.1.0"
description = "Packaged dataset-prep and training pipeline for piper1-gpl"
requires-python = ">=3.12"

[project.scripts]
piper-trainer = "piper_trainer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# What the pipeline needs beyond the stdlib. The SUPPORTED path is the
# container: piper1-gpl (with both C extensions), ffmpeg, espeak-ng, and
# deep-filter are not pip-installable and are expected on PATH — run
# `piper-trainer doctor` to see what is missing. The default install is
# deliberately dependency-free.
runtime = ["auditok>=0.3", "faster-whisper", "soundfile", "numpy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
